<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - King Smoke Shop and Vapors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --secondary: #1a1a1a;
            --accent: #ff6b35;
            --light: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            color: #333;
            line-height: 1.6;
        }

        .navbar {
            background: linear-gradient(135deg, var(--secondary) 0%, #2a2a2a 100%);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-header {
            background: linear-gradient(135deg, var(--secondary) 0%, #2a2a2a 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .blog-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            padding: 2rem 0;
        }

        .blog-posts {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .blog-post {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .blog-post:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
        }

        .blog-hero {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .blog-content {
            padding: 2rem;
        }

        .blog-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #999;
        }

        .blog-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .blog-title {
            font-size: 1.8rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .blog-excerpt {
            color: #666;
            margin-bottom: 1rem;
        }

        .read-more {
            background: var(--primary);
            color: var(--secondary);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .read-more:hover {
            background: #e0c158;
            transform: translateX(5px);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .sidebar-box h3 {
            color: var(--secondary);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.5rem;
        }

        .sidebar-box ul {
            list-style: none;
        }

        .sidebar-box ul li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--light);
        }

        .sidebar-box ul li:last-child {
            border-bottom: none;
        }

        .sidebar-box a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .sidebar-box a:hover {
            color: var(--accent);
        }

        .newsletter {
            background: linear-gradient(135deg, var(--primary) 0%, #e0c158 100%);
            color: var(--secondary);
            padding: 1.5rem;
        }

        .newsletter input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-bottom: 0.5rem;
        }

        .newsletter button {
            width: 100%;
            padding: 10px;
            background: var(--secondary);
            color: var(--primary);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .blog-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">👑 King Smoke Shop</div>
            <ul class="nav-links">
                <li><a href="index-enhanced.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="index-enhanced.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-header">
        <h1>📰 King Smoke Blog</h1>
        <p>Expert insights and industry news</p>
    </div>

    <div class="container">
        <div class="blog-container">
            <div class="blog-posts" id="blogPosts">
                <!-- Blog posts will load here -->
            </div>
            <div class="sidebar">
                <div class="sidebar-box">
                    <h3>📌 Popular Posts</h3>
                    <ul id="popularPosts">
                        <!-- Popular posts will load here -->
                    </ul>
                </div>
                <div class="sidebar-box newsletter">
                    <h3>📧 Newsletter</h3>
                    <p style="margin-bottom: 1rem; font-size: 0.9rem;">Subscribe for updates</p>
                    <input type="email" placeholder="Your email" required>
                    <button>Subscribe</button>
                </div>
                <div class="sidebar-box">
                    <h3>🏷️ Categories</h3>
                    <ul id="categories">
                        <!-- Categories will load here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const blogPosts = [
            {
                id: 1,
                title: "How to Choose the Right Vape Device for You",
                excerpt: "Finding the perfect vaping device can be overwhelming with so many options available. Learn what factors to consider when making your choice.",
                content: "Full content...",
                category: "Vaping",
                date: "2024-09-10",
                author: "King Team",
                icon: "💨"
            },
            {
                id: 2,
                title: "The Art of Cigar Rolling: A Beginner's Guide",
                excerpt: "Discover the traditional techniques used in hand-rolling cigars and how our premium selections are crafted with care.",
                content: "Full content...",
                category: "Cigars",
                date: "2024-09-08",
                author: "King Team",
                icon: "🚬"
            },
            {
                id: 3,
                title: "E-Liquid Flavors: What You Need to Know",
                excerpt: "Explore the different flavor profiles available in our e-liquid collection and find your perfect match.",
                content: "Full content...",
                category: "E-Liquids",
                date: "2024-09-05",
                author: "King Team",
                icon: "🧪"
            },
            {
                id: 4,
                title: "Maintenance Tips for Your Vaping Equipment",
                excerpt: "Keep your vaping devices in top condition with these essential maintenance tips and tricks.",
                content: "Full content...",
                category: "Accessories",
                date: "2024-09-01",
                author: "King Team",
                icon: "🔧"
            },
            {
                id: 5,
                title: "Premium Tobacco vs. Regular: What's the Difference?",
                excerpt: "Understand the quality differences and why premium tobacco is worth the investment.",
                content: "Full content...",
                category: "Tobacco",
                date: "2024-08-28",
                author: "King Team",
                icon: "🌾"
            }
        ];

        function displayBlogPosts() {
            const container = document.getElementById('blogPosts');
            container.innerHTML = blogPosts.map(post => `
                <div class="blog-post">
                    <div class="blog-hero">${post.icon}</div>
                    <div class="blog-content">
                        <div class="blog-meta">
                            <span><i class="fas fa-calendar"></i> ${new Date(post.date).toLocaleDateString()}</span>
                            <span><i class="fas fa-tag"></i> ${post.category}</span>
                            <span><i class="fas fa-user"></i> ${post.author}</span>
                        </div>
                        <h2 class="blog-title">${post.title}</h2>
                        <p class="blog-excerpt">${post.excerpt}</p>
                        <button class="read-more">Read More →</button>
                    </div>
                </div>
            `).join('');
        }

        function displayPopularPosts() {
            const container = document.getElementById('popularPosts');
            const popular = blogPosts.slice(0, 5);
            container.innerHTML = popular.map(post => `
                <li><a href="#post-${post.id}">${post.title}</a></li>
            `).join('');
        }

        function displayCategories() {
            const container = document.getElementById('categories');
            const categories = [...new Set(blogPosts.map(p => p.category))];
            container.innerHTML = categories.map(cat => `
                <li><a href="#category-${cat}">${cat}</a></li>
            `).join('');
        }

        displayBlogPosts();
        displayPopularPosts();
        displayCategories();
    </script>
</body>
</html>
