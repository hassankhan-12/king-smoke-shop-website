<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - King Smoke Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --secondary: #1a1a1a;
            --light: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, var(--secondary) 0%, #2a2a2a 100%);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-header {
            background: linear-gradient(135deg, var(--secondary) 0%, #2a2a2a 100%);
            color: white;
            padding: 40px 20px;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 2rem 0;
            min-height: 60vh;
        }

        .cart-items {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cart-items h2 {
            color: var(--secondary);
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            gap: 1rem;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--light);
            transition: background 0.3s;
        }

        .cart-item:hover {
            background: var(--light);
        }

        .item-icon {
            font-size: 3rem;
            text-align: center;
        }

        .item-info h3 {
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .item-info p {
            color: #999;
            font-size: 0.9rem;
        }

        .item-price {
            text-align: right;
        }

        .item-price .price {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: bold;
        }

        .quantity-control {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }

        .quantity-control button {
            background: var(--primary);
            color: var(--secondary);
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .quantity-control button:hover {
            background: #e0c158;
        }

        .quantity-control input {
            width: 40px;
            text-align: center;
            border: 1px solid var(--light);
            padding: 5px;
            border-radius: 3px;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-cart i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--light);
        }

        .cart-summary {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 100px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--light);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #e0c158 100%);
            color: var(--secondary);
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .continue-shopping {
            width: 100%;
            background: transparent;
            color: var(--secondary);
            padding: 10px;
            border: 2px solid var(--light);
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s;
        }

        .continue-shopping:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                grid-template-columns: 60px 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">👑 King Smoke Shop</div>
            <ul class="nav-links">
                <li><a href="index-enhanced.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="index-enhanced.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-header">
        <h1>🛒 Shopping Cart</h1>
    </div>

    <div class="container">
        <div class="cart-content">
            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items will load here -->
            </div>
            <div class="cart-summary">
                <h3 style="color: var(--secondary); margin-bottom: 1rem;">Order Summary</h3>
                <div class="summary-item">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-item">
                    <span>Tax (8%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-item">
                    <span>Shipping:</span>
                    <span id="shipping">Free</span>
                </div>
                <div class="summary-item total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
                <button class="continue-shopping" onclick="window.location.href='shop.html'">Continue Shopping</button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function displayCart() {
            const container = document.getElementById('cartItemsContainer');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h2>Your cart is empty</h2>
                        <p>Add items from the shop to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<h2>Items in Cart</h2>' + cart.map((item, index) => `
                <div class="cart-item">
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>${item.category}</p>
                        <div class="quantity-control">
                            <button onclick="updateQuantity(${index}, -1)">−</button>
                            <input type="number" value="${item.quantity}" min="1" onchange="setQuantity(${index}, this.value)">
                            <button onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                    </div>
                    <div class="item-price">
                        <div class="price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>
                </div>
            `).join('');

            updateSummary();
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity < 1) cart[index].quantity = 1;
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }

        function setQuantity(index, value) {
            const qty = parseInt(value);
            if (qty > 0) {
                cart[index].quantity = qty;
                localStorage.setItem('cart', JSON.stringify(cart));
                displayCart();
            }
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }

        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.08;
            const shipping = subtotal > 0 ? 0 : 0;
            const total = subtotal + tax + shipping;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('shipping').textContent = shipping > 0 ? `$${shipping.toFixed(2)}` : 'Free';
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('Checkout feature coming soon! Thank you for your interest.');
        }

        displayCart();
    </script>
</body>
</html>
